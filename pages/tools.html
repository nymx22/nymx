<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tools</title>
    <link rel="icon" type="image/png" href="../assets/icons/fav_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.typekit.net/pew7esm.css">
    <link rel="stylesheet" href="../style/desktop/cursor.css" />
    <link rel="stylesheet" type="text/css" href="../poles/css/style.css" />
    <link rel="stylesheet" type="text/css" href="../poles/css/gui.css" />
    
    <style>
      @font-face {
        font-family: 'Hershey-Noailles-Futura-Triplex-Bold';
        src: url('../assets/fonts/Hershey-Noailles-Futura-Triplex-Bold.woff') format('woff');
        font-display: swap;
      }

      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #ffffff;
        cursor: none;
        overflow: hidden;
      }

      .back-link {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 10px 20px;
        background: #FFFFFF;
        color: #000000;
        border: 2px solid #000000;
        border-radius: 6px;
        text-decoration: none;
        font-family: 'Hershey-Noailles-Futura-Triplex-Bold', sans-serif;
        font-size: 16px;
        transition: all 0.2s ease;
        z-index: 1000;
      }

      .back-link:hover {
        background: #000000;
        color: #FFFFFF;
        border-color: #000000;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }

      /* Hover hint text styling */
      #hover-hint {
        position: fixed;
        pointer-events: none;
        font-family: 'Hershey-Noailles-Futura-Triplex-Bold', sans-serif;
        font-size: 24px;
        color: #000000;
        background: rgba(255, 255, 255, 0.9);
        padding: 8px 16px;
        border-radius: 4px;
        border: 2px solid #000000;
        z-index: 10001;
        opacity: 0;
        transition: opacity 0.2s ease;
        white-space: nowrap;
        transform: translateX(-50%);
      }

      #hover-hint.visible {
        opacity: 1;
      }

      canvas {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <audio id="background-music" loop preload="metadata">
      <source src="../assets/audio/Solo from More Travels.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
    <div class="custom-cursor"></div>
    
    <a href="basement.html" class="back-link">Back to Basement</a>
    <div id="hover-hint">glitch engine</div>
    
    <main></main>

    <!-- p5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.7/build/dat.gui.min.js"></script>
    
    <!-- sketch -->
    <script src="../poles/classes/Pole.js"></script>
    <script src="../poles/classes/Wire.js"></script>
    <script src="../poles/classes/NoiseTexturePool.js"></script>
    <script src="../poles/frame.js"></script>
    
    <script type="module">
      import { initBackgroundMusic } from '../js/lib/music.js';
      import { initCustomCursor } from '../js/lib/desktop/cursor.js';
      
      // Initialize background music
      initBackgroundMusic();
      
      // Initialize custom cursor
      initCustomCursor();
    </script>
  </body>
</html>
