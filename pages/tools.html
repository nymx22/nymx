<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tools</title>
    <link rel="icon" type="image/png" href="../assets/icons/fav_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.typekit.net/pew7esm.css">
    <link rel="stylesheet" href="../style/desktop/cursor.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #000000;
        color: #ffffff;
        font-family: 'Jersey 25', sans-serif;
        cursor: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .tools-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
        padding: 40px;
      }

      h1 {
        font-size: 48px;
        margin-bottom: 20px;
        text-align: center;
      }

      .tools-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 30px;
        max-width: 800px;
        width: 100%;
      }

      .tool-card {
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        padding: 30px;
        text-align: center;
        text-decoration: none;
        color: #ffffff;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }

      .tool-card:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.5);
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
      }

      .tool-card h2 {
        font-size: 28px;
        margin: 0;
      }

      .tool-card p {
        font-size: 16px;
        margin: 0;
        opacity: 0.8;
      }

      @font-face {
        font-family: 'Hershey-Noailles-Futura-Triplex-Bold';
        src: url('../assets/fonts/Hershey-Noailles-Futura-Triplex-Bold.woff') format('woff');
        font-display: swap;
      }

      .back-link {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 10px 20px;
        background: #FFFFFF;
        color: #000000;
        border: 2px solid #000000;
        border-radius: 6px;
        text-decoration: none;
        font-family: 'Hershey-Noailles-Futura-Triplex-Bold', sans-serif;
        font-size: 16px;
        transition: all 0.2s ease;
        z-index: 1000;
      }

      .back-link:hover {
        background: #000000;
        color: #FFFFFF;
        border-color: #000000;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }

      @media (max-width: 767px) {
        h1 {
          font-size: 32px;
        }

        .tools-grid {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        .tool-card {
          padding: 20px;
        }

        .tool-card h2 {
          font-size: 24px;
        }

        .tool-card p {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <audio id="background-music" loop preload="metadata">
      <source src="../assets/audio/Solo from More Travels.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
    <div class="custom-cursor"></div>
    
    <a href="../pages/basement.html" class="back-link">Back to Basement</a>
    
    <div class="tools-container">
      <h1>Tools</h1>
      <div class="tools-grid">
        <a href="glitchengine.html" class="tool-card">
          <h2>Glitch Engine</h2>
          <p>Apply glitch effects to images and videos</p>
        </a>
      </div>
    </div>
    
    <script type="module">
      import { initBackgroundMusic } from '../js/lib/music.js';
      import { initCustomCursor } from '../js/lib/desktop/cursor.js';
      
      // Initialize background music
      initBackgroundMusic();
      
      // Initialize custom cursor
      initCustomCursor();
    </script>
  </body>
</html>
