<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>about</title>
    <link rel="icon" type="image/png" href="../assets/icons/fav_icon.png">
    <link rel="stylesheet" href="https://use.typekit.net/njg8xol.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../style/main.css" />
    <link rel="stylesheet" href="../style/basement/layout.css" />
    <link rel="stylesheet" href="../style/basement/wall.css" />
    <link rel="stylesheet" href="../style/desktop/cursor.css" />
    <link rel="stylesheet" href="../style/basement/qqWindow.css" />
    <link rel="stylesheet" href="../style/about/pokemon.css" />
    <!-- Firebase SDK (compat version for regular script tags) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js" defer></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      
      /* Apply Typekit font to all elements on about page */
      /* Replace 'YOUR_FONT_NAME' with the actual font family name from Adobe Fonts */
      /* Check browser console for detected font name, or check your Adobe Fonts project */
      * {
        font-family: var(--typekit-font, 'YOUR_FONT_NAME'), sans-serif !important;
      }
      
      /* Wall section - full height with new color palette */
      .wall-section {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: 0;
        background: #CBDCEB; /* Very light soft blue - consistent background */
      }
      .back-button {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 10001;
        background: #E8DFCA; /* Warmer beige */
        border: 2px solid #6D94C5; /* Medium blue border */
        color: #6D94C5; /* Medium blue text */
        padding: 8px 16px;
        font-family: 'njg8xol', sans-serif;
        font-size: 14px;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-block;
        font-weight: bold;
      }
      .back-button:hover {
        background: #CBDCEB; /* Light blue on hover */
        border-color: #6D94C5;
      }
      .qq-profile-photo,
      .qq-profile-photo-large {
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .qq-profile-photo:hover,
      .qq-profile-photo-large:hover {
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>
    <div class="wall-section"></div>
    <div class="custom-cursor"></div>
    <a href="/pages/basement.html" class="back-button">← Back</a>
    
    <!-- QQ Window -->
    <div class="qqWindow qq-window-visible">
      <div class="qq-window-titlebar">
        <div class="qq-titlebar-left">
          <div class="qq-profile-photo" id="profilePhoto"></div>
          <span class="qq-window-title">nymx.22</span>
        </div>
        <div class="qq-window-controls">
          <button class="qq-window-close">×</button>
        </div>
      </div>
      <div class="qq-window-chat-area">
        <div class="qq-chat-messages-container" id="chatMessagesContainer" style="display: none;">
          <div class="qq-chat-messages" id="chatMessages">
            <!-- Messages will appear here -->
          </div>
        </div>
        <div class="qq-name-input-section" id="nameInputSection">
          <input type="text" class="qq-name-input" id="userNameInput" placeholder="Enter your name..." maxlength="20">
          <button class="qq-name-submit-btn" id="nameSubmitBtn">Start Chat</button>
        </div>
      </div>
      <div class="qq-window-input-area">
        <div class="qq-input-field-container">
          <textarea class="qq-input-field" placeholder="Type a message..."></textarea>
        </div>
      </div>
      <div class="qq-user-display-section" id="userDisplaySection" style="display: none;">
        <div class="qq-user-avatar" id="userAvatar"></div>
        <span class="qq-user-name" id="userNameDisplay"></span>
        <button type="button" class="qq-change-name-btn" id="changeNameBtn">Change</button>
      </div>
      <div class="qq-window-bottom-bar">
        <button type="button" class="qq-send-btn">Send</button>
        <button class="qq-close-btn">Close</button>
      </div>
    </div>

    <!-- Pokémon Stat Window -->
    <div class="pokemon-stat-screen" id="pokemonWindow">
      <div class="pokemon-header">
        <div class="pokemon-title">STATS</div>
        <div class="pokemon-nav-icons">
          <div class="nav-icon"></div>
          <div class="nav-icon"></div>
          <div class="nav-icon active"></div>
          <div class="nav-icon"></div>
          <div class="nav-icon"></div>
        </div>
        <div class="pokemon-window-controls">
          <button class="pokemon-window-close">×</button>
        </div>
      </div>
      <div class="pokemon-content">
        <div class="pokemon-left-panel">
          <div class="pokemon-info-box">
            <div class="pokemon-name-row">
              <img src="../assets/icons/fav_icon.png" alt="Poké Ball" class="pokeball-icon">
              <span class="pokemon-name">Kidling</span>
              <span class="pokemon-gender">♂</span>
            </div>
            <div class="pokemon-level">Lv. 7</div>
          </div>
          <div class="pokemon-sprite-area">
            <img src="../assets/icons/fav_icon.png" alt="Pokémon" class="pokemon-sprite">
          </div>
          <div class="pokemon-navigation">
            <div class="nav-dots">
              <span class="nav-dot"></span>
              <span class="nav-dot"></span>
              <span class="nav-dot"></span>
            </div>
            <div class="nav-arrows">
              <span class="nav-arrow-up">▲</span>
              <span class="nav-arrow-down">▼</span>
            </div>
          </div>
          <div class="pokemon-item">
            <div class="item-label">Item</div>
            <div class="item-value">None</div>
          </div>
        </div>
        <div class="pokemon-right-panel">
          <div class="pokemon-stats-box">
            <div class="pokemon-stat-hp">
              <div class="stat-hp-header">
                <span class="stat-label-hp">HP</span>
                <span class="stat-hp-values">18/24</span>
                <span class="stat-hp-extra">26/0</span>
              </div>
              <div class="hp-bar-wrapper">
                <div class="hp-bar-label">HP</div>
                <div class="hp-bar-container">
                  <div class="hp-bar" style="width: 75%"></div>
                </div>
              </div>
            </div>
            <div class="pokemon-stat-item">
              <span class="stat-label">Attack</span>
              <span class="stat-value-main">15</span>
              <span class="stat-value-extra">22/1</span>
            </div>
            <div class="pokemon-stat-item">
              <span class="stat-label">Defense</span>
              <span class="stat-value-main">13</span>
              <span class="stat-value-extra">10/0</span>
            </div>
            <div class="pokemon-stat-item">
              <span class="stat-label">Sp. Atk</span>
              <span class="stat-value-main">12</span>
              <span class="stat-value-extra">31/0</span>
            </div>
            <div class="pokemon-stat-item">
              <span class="stat-label">Sp. Def</span>
              <span class="stat-value-main">13</span>
              <span class="stat-value-extra">29/0</span>
            </div>
            <div class="pokemon-stat-item">
              <span class="stat-label">Speed</span>
              <span class="stat-value-main">14</span>
              <span class="stat-value-extra">22/1</span>
            </div>
            <div class="pokemon-ability">
              <div class="ability-label">Ability</div>
              <div class="ability-name">Blaze</div>
              <div class="ability-description">Powers up Fire-type moves in a pinch.</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Firebase Configuration -->
    <script>
      // TODO: Replace these values with your Firebase config from Firebase Console
      // To find these values:
      // 1. Go to https://console.firebase.google.com/
      // 2. Select your project
      // 3. Click the gear icon ⚙️ → Project settings
      // 4. Scroll to "Your apps" section
      // 5. Click on your web app (or create one if you haven't)
      // 6. Copy the firebaseConfig object values below
      
      const firebaseConfig = {
  apiKey: "AIzaSyDUIdEVa8kXin1R_1I2JlV0cl-PBSCQ6_c",
  authDomain: "nymx-chat.firebaseapp.com",
  databaseURL: "https://nymx-chat-default-rtdb.firebaseio.com",
  projectId: "nymx-chat",
  storageBucket: "nymx-chat.firebasestorage.app",
  messagingSenderId: "445185128474",
  appId: "1:445185128474:web:c098690079a107989179a3"
};

      // Initialize Firebase
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        window.database = firebase.database();
        console.log('Firebase initialized successfully');
      } else {
        console.error('Firebase SDK not loaded. Check if scripts are loaded correctly.');
      }
    </script>

    <script type="module">
      import { initCustomCursor } from '../js/lib/desktop/cursor.js';
      // Initialize custom cursor
      initCustomCursor();
      
      // Debug: Check what fonts are loaded from Typekit
      // Open browser console to see the font family name
      window.addEventListener('load', () => {
        setTimeout(() => {
          // Check all @font-face rules
          const styleSheets = Array.from(document.styleSheets);
          const fontFamilies = new Set();
          
          styleSheets.forEach(sheet => {
            try {
              if (sheet.href && sheet.href.includes('typekit.net')) {
                const rules = Array.from(sheet.cssRules || []);
                rules.forEach(rule => {
                  if (rule instanceof CSSFontFaceRule) {
                    const fontFamily = rule.style.fontFamily;
                    fontFamilies.add(fontFamily);
                    console.log('Found Typekit font:', fontFamily);
                  }
                });
              }
            } catch (e) {
              // Cross-origin - try alternative method
            }
          });
          
          if (fontFamilies.size > 0) {
            console.log('Available Typekit fonts:', Array.from(fontFamilies));
            // Apply the first found font
            const fontName = Array.from(fontFamilies)[0];
            document.documentElement.style.setProperty('--typekit-font', fontName);
            document.body.style.fontFamily = `${fontName}, sans-serif`;
          } else {
            console.warn('No Typekit fonts found. Please check:');
            console.warn('1. Go to your Adobe Fonts project page');
            console.warn('2. Look for "Web Project" or "Font Family" name');
            console.warn('3. Use that exact name in CSS (case-sensitive)');
          }
        }, 500);
      });
      
      // Initialize QQ window functionality
      const qqWindow = document.querySelector('.qqWindow');
      const closeBtn = qqWindow.querySelector('.qq-window-close');
      const closeBottomBtn = qqWindow.querySelector('.qq-close-btn');
      const sendBtn = qqWindow.querySelector('.qq-send-btn');
      const inputField = qqWindow.querySelector('.qq-input-field');
      const chatMessages = document.getElementById('chatMessages');
      const chatMessagesContainer = document.getElementById('chatMessagesContainer');
      const nameInputSection = document.getElementById('nameInputSection');
      const userNameInput = document.getElementById('userNameInput');
      const nameSubmitBtn = document.getElementById('nameSubmitBtn');
      const userDisplaySection = document.getElementById('userDisplaySection');
      const userAvatar = document.getElementById('userAvatar');
      const userNameDisplay = document.getElementById('userNameDisplay');
      const changeNameBtn = document.getElementById('changeNameBtn');
      const profilePhoto = document.getElementById('profilePhoto');
      const pokemonWindow = document.getElementById('pokemonWindow');
      const pokemonCloseBtn = pokemonWindow.querySelector('.pokemon-window-close');
      
      // Chat state
      let currentUserName = '';
      let userNameSet = false;
      let messageListener = null;
      const displayedMessageKeys = new Set(); // Track displayed message keys to prevent duplicates
      
      // Display message function (must be defined before loadMessages)
      const displayMessage = (userName, message, isOwner, timestamp) => {
        const messageDiv = document.createElement('div');
        messageDiv.className = isOwner ? 'qq-message qq-message-received' : 'qq-message qq-message-sent';
        
        const nameSpan = document.createElement('span');
        nameSpan.className = 'qq-message-name';
        nameSpan.textContent = userName + ': ';
        nameSpan.style.fontWeight = 'bold';
        
        const textSpan = document.createElement('span');
        textSpan.textContent = message;
        
        messageDiv.appendChild(nameSpan);
        messageDiv.appendChild(textSpan);
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      };
      
      // Load existing messages
      const loadMessages = () => {
        if (!window.database) {
          console.error('Firebase database not available');
          return;
        }
        
        displayedMessageKeys.clear(); // Reset tracked keys
        
        window.database.ref('messages').orderByChild('timestamp').once('value', (snapshot) => {
          chatMessages.innerHTML = ''; // Clear existing
          snapshot.forEach((childSnapshot) => {
            const msgKey = childSnapshot.key;
            const msg = childSnapshot.val();
            displayMessage(msg.userName, msg.message, msg.isOwner || false, msg.timestamp);
            displayedMessageKeys.add(msgKey); // Track loaded messages
          });
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }).catch((error) => {
          console.error('Error loading messages:', error);
        });
      };
      
      // Listen for new messages in real-time
      const startListeningForMessages = () => {
        if (!window.database) {
          console.error('Firebase database not available');
          return;
        }
        
        // Listen for new messages added after page load
        messageListener = window.database.ref('messages').orderByChild('timestamp').on('child_added', (snapshot) => {
          const msgKey = snapshot.key;
          // Only display if we haven't shown this message yet
          if (!displayedMessageKeys.has(msgKey)) {
            const msg = snapshot.val();
            displayMessage(msg.userName, msg.message, msg.isOwner || false, msg.timestamp);
            displayedMessageKeys.add(msgKey);
          }
        });
      };
      
      // Send button functionality
      const sendMessage = () => {
        if (!userNameSet) {
          alert('Please enter your name first');
          if (userNameInput) {
            userNameInput.focus();
          }
          return;
        }
        
        if (!window.database) {
          console.error('Firebase database not available');
          alert('Chat is not available. Please refresh the page.');
          return;
        }
        
        const message = inputField.value.trim();
        if (message) {
          // Save to Firebase
          const messageData = {
            userName: currentUserName,
            message: message,
            timestamp: firebase.database.ServerValue.TIMESTAMP,
            isOwner: false // visitor messages
          };
          
          window.database.ref('messages').push(messageData)
            .then(() => {
              inputField.value = '';
              chatMessages.scrollTop = chatMessages.scrollHeight;
            })
            .catch((error) => {
              console.error('Error sending message:', error);
              alert('Failed to send message. Please try again.');
            });
        }
      };
      
      // Check if user name is stored in localStorage
      const storedName = localStorage.getItem('nymx_chat_username');
      if (storedName) {
        currentUserName = storedName;
        userNameSet = true;
        nameInputSection.style.display = 'none';
        userDisplaySection.style.display = 'flex';
        userNameDisplay.textContent = storedName;
        chatMessagesContainer.style.display = 'block';
        loadMessages();
        startListeningForMessages();
      }
      
      // Change name button functionality
      if (changeNameBtn) {
        changeNameBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          console.log('Change name button clicked');
          nameInputSection.style.display = 'flex';
          userDisplaySection.style.display = 'none';
          if (currentUserName) {
            userNameInput.value = currentUserName; // Pre-fill with current name
          }
          userNameInput.focus();
        });
      } else {
        console.error('Change name button not found');
      }
      
      // Name input functionality
      nameSubmitBtn.addEventListener('click', () => {
        const name = userNameInput.value.trim();
        if (name) {
          currentUserName = name;
          userNameSet = true;
          localStorage.setItem('nymx_chat_username', name);
          nameInputSection.style.display = 'none';
          userDisplaySection.style.display = 'flex';
          userNameDisplay.textContent = name;
          chatMessagesContainer.style.display = 'block';
          loadMessages();
          startListeningForMessages();
        }
      });
      
      userNameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          nameSubmitBtn.click();
        }
      });
      
      // Close QQ window handlers
      const closeQQWindow = () => {
        // Stop listening to messages when closing
        if (messageListener) {
          window.database.ref('messages').off('child_added', messageListener);
        }
        window.location.href = '/pages/basement.html';
      };
      
      closeBtn.addEventListener('click', closeQQWindow);
      closeBottomBtn.addEventListener('click', closeQQWindow);
      
      // Set up send button event listener
      if (sendBtn && inputField) {
        sendBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          console.log('Send button clicked, calling sendMessage');
          sendMessage();
        });
        
        inputField.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            e.stopPropagation();
            console.log('Enter key pressed, calling sendMessage');
            sendMessage();
          }
        });
        
        console.log('Send button and Enter key listeners set up successfully');
      } else {
        console.error('Send button or input field not found', { 
          sendBtn: !!sendBtn, 
          inputField: !!inputField 
        });
      }
      
      // Open Pokémon window when profile photo is clicked
      const openPokemonWindow = () => {
        pokemonWindow.classList.add('pokemon-window-visible');
      };
      
      profilePhoto.addEventListener('click', openPokemonWindow);
      
      // Close Pokémon window
      const closePokemonWindow = () => {
        pokemonWindow.classList.remove('pokemon-window-visible');
      };
      
      pokemonCloseBtn.addEventListener('click', closePokemonWindow);
      
      // Make QQ window draggable
      const qqTitleBar = qqWindow.querySelector('.qq-window-titlebar');
      let qqIsDragging = false;
      let qqCurrentX;
      let qqCurrentY;
      let qqInitialX;
      let qqInitialY;
      let qqXOffset = 0;
      let qqYOffset = 0;
      
      qqTitleBar.addEventListener('mousedown', qqDragStart);
      document.addEventListener('mousemove', qqDrag);
      document.addEventListener('mouseup', qqDragEnd);
      
      function qqDragStart(e) {
        if (e.target.classList.contains('qq-window-close') || e.target.classList.contains('qq-profile-photo')) {
          return;
        }
        qqInitialX = e.clientX - qqXOffset;
        qqInitialY = e.clientY - qqYOffset;
        if (e.target === qqTitleBar || qqTitleBar.contains(e.target)) {
          qqIsDragging = true;
        }
      }
      
      function qqDrag(e) {
        if (qqIsDragging) {
          e.preventDefault();
          qqCurrentX = e.clientX - qqInitialX;
          qqCurrentY = e.clientY - qqInitialY;
          qqXOffset = qqCurrentX;
          qqYOffset = qqCurrentY;
          setQQTranslate(qqCurrentX, qqCurrentY, qqWindow);
        }
      }
      
      function qqDragEnd(e) {
        qqInitialX = qqCurrentX;
        qqInitialY = qqCurrentY;
        qqIsDragging = false;
      }
      
      function setQQTranslate(xPos, yPos, el) {
        el.style.transform = `translate(calc(-50% + ${xPos}px), calc(-50% + ${qqYOffset}px)) scale(1)`;
      }
      
      // Make Pokémon window draggable
      const pokemonHeader = pokemonWindow.querySelector('.pokemon-header');
      let pokemonIsDragging = false;
      let pokemonCurrentX;
      let pokemonCurrentY;
      let pokemonInitialX;
      let pokemonInitialY;
      let pokemonXOffset = 0;
      let pokemonYOffset = 0;
      
      pokemonHeader.addEventListener('mousedown', pokemonDragStart);
      document.addEventListener('mousemove', pokemonDrag);
      document.addEventListener('mouseup', pokemonDragEnd);
      
      function pokemonDragStart(e) {
        if (e.target.classList.contains('pokemon-window-close')) {
          return;
        }
        pokemonInitialX = e.clientX - pokemonXOffset;
        pokemonInitialY = e.clientY - pokemonYOffset;
        if (e.target === pokemonHeader || pokemonHeader.contains(e.target)) {
          pokemonIsDragging = true;
        }
      }
      
      function pokemonDrag(e) {
        if (pokemonIsDragging) {
          e.preventDefault();
          pokemonCurrentX = e.clientX - pokemonInitialX;
          pokemonCurrentY = e.clientY - pokemonInitialY;
          pokemonXOffset = pokemonCurrentX;
          pokemonYOffset = pokemonCurrentY;
          setPokemonTranslate(pokemonCurrentX, pokemonCurrentY, pokemonWindow);
        }
      }
      
      function pokemonDragEnd(e) {
        pokemonInitialX = pokemonCurrentX;
        pokemonInitialY = pokemonCurrentY;
        pokemonIsDragging = false;
      }
      
      function setPokemonTranslate(xPos, yPos, el) {
        el.style.transform = `translate(calc(-50% + ${xPos}px), calc(-50% + ${pokemonYOffset}px))`;
      }
    </script>
  </body>
</html>
