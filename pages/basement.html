<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>basement</title>
    <link rel="icon" type="image/png" href="../assets/icons/fav_icon.png">
    <link rel="stylesheet" href="https://use.typekit.net/pew7esm.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/main.css" />
    <link rel="stylesheet" href="../style/basement/layout.css" />
    <link rel="stylesheet" href="../style/basement/wall.css" />
    <link rel="stylesheet" href="../style/basement/floor.css" />
    <link rel="stylesheet" href="../style/basement/pebbles.css" />
    <link rel="stylesheet" href="../style/basement/stair.css" />
    <link rel="stylesheet" href="../style/basement/self.css" />
    <link rel="stylesheet" href="../style/basement/self0hint.css" />
    <link rel="stylesheet" href="../style/basement/mirror.css" />
    <link rel="stylesheet" href="../style/basement/qqWindow.css" />
    <link rel="stylesheet" href="../style/basement/glitch.css" />
    <link rel="stylesheet" href="../style/basement/vignette.css" />
    <link rel="stylesheet" href="../style/basement/cursor.css" />
    <audio id="background-music" loop preload="metadata">
      <source src="../assets/audio/Solo from More Travels.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js" defer></script>
    <style>
      /* Loading screen */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: #ffffff;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.8s ease-out;
      }
      
      .loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      /* Hide content until loaded (but not cursor) */
      body.loading .wall-section,
      body.loading .floor-section,
      body.loading .stair-container,
      body.loading .self-container,
      body.loading #basement-glitch-canvas,
      body.loading .vignette-overlay {
        opacity: 0;
      }
      
      /* Smooth fade-in for content */
      .wall-section,
      .floor-section,
      .stair-container,
      .self-container,
      #basement-glitch-canvas,
      .vignette-overlay {
        transition: opacity 0.8s ease-in;
      }
    </style>
  </head>
  <body class="loading">
    <!-- Loading screen -->
    <div class="loading-screen" id="loadingScreen"></div>
    
    <div class="custom-cursor">
      <img src="../assets/gif/cursor.gif" alt="cursor" loading="eager">
    </div>
    
    <!-- Background sections -->
    <div class="wall-section"></div>
    <div class="floor-section">
      <a href="../pages/tools.html" class="floor-tool-link">
        <img src="../assets/images/tool/tool.png" alt="Tool" class="floor-tool" id="floorTool" loading="lazy">
      </a>
    </div>
    
    <!-- Stair on left side (return button) -->
    <a href="../index.html" class="stair-container">
      <div id="stair-shader-container"></div>
    </a>
    
    <!-- Mirror on left wall -->
    <div class="mirror-container">
      <div class="mirror-glass-reflection"></div>
      <div class="mirror-reflection" id="mirrorReflection"></div>
      <img src="../assets/images/mirror.png" alt="Mirror" class="mirror-frame" loading="lazy">
    </div>
    
      <!-- Self 0 with shader effects -->
    <div class="self-container">
      <div id="self-shader-container"></div>
      <div class="basement-control-bubble" id="basementControlBubble">
        <div class="controls-label">control:</div>
        <div class="controls-arrows">&lt;-- left , right --&gt;</div>
      </div>
    </div>
    
    <!-- Snow glitch overlay -->
    <div id="basement-glitch-canvas"></div>
    
    <!-- White vignette overlay -->
    <div class="vignette-overlay"></div>
    
    <script type="module">
      import { initBackgroundMusic } from '../js/lib/music.js';
      import { initPebbleFloor } from '../js/lib/desktop/pebbleFloor.js';
      
      // Initialize background music
      initBackgroundMusic();
      import { pureSnow } from '../js/effects/glitch/pureSnow.js';
      import { purpleStatic } from '../js/effects/glitch/purpleStatic.js';
      import { initSelf0Shader } from '../js/lib/selfmovement/self0Shader.js';
      import { initStairShader } from '../js/lib/basement/stairShader.js';
      import { initMirrorReflection } from '../js/lib/basement/mirrorReflection.js';
      
      // Make pureSnow available globally for basement glitch
      window.pureSnow = pureSnow;
      // Make purpleStatic available globally for mirror reflection
      window.purpleStatic = purpleStatic;
      
      // Wait for everything to load
      window.addEventListener('load', async () => {
        const loadingScreen = document.getElementById('loadingScreen');
        
        // Initialize custom cursor
        const customCursor = document.querySelector('.custom-cursor');
        document.addEventListener('mousemove', (e) => {
          customCursor.style.setProperty('--mouse-x', `${e.clientX - 32}px`);
          customCursor.style.setProperty('--mouse-y', `${e.clientY - 32}px`);
        }, { passive: true });
        
      let pebbleFloorBusy = false;
      const rebuildPebbleFloor = async () => {
        if (pebbleFloorBusy) return;
        pebbleFloorBusy = true;
        try {
          await initPebbleFloor();
        } catch (error) {
          console.error('Pebble floor rebuild failed', error);
        } finally {
          pebbleFloorBusy = false;
        }
      };

      // Initialize pebble floor
      await rebuildPebbleFloor();
        
        // Initialize self0 shader with GUI
        initSelf0Shader();
        
        // Wait a bit for self to be initialized, then setup mirror reflection
        setTimeout(() => {
          if (window.__selfInstance && window.__selfShader) {
            console.log('Initializing mirror reflection with self instance:', window.__selfInstance);
            initMirrorReflection(window.__selfInstance, window.__selfShader);
          } else {
            console.error('Self instance or shader not available:', {
              instance: window.__selfInstance,
              shader: window.__selfShader
            });
          }
        }, 1000);
        
        // Initialize stair shader
        initStairShader();
        
        // Initialize p5 sketch for snow glitch (optimized)
        const sketch = (p) => {
          p.setup = () => {
            const canvas = p.createCanvas(p.windowWidth, p.windowHeight);
            canvas.parent('basement-glitch-canvas');
            p.pixelDensity(1);
            p.frameRate(30); // Limit frame rate for performance
          };
          
          p.draw = () => {
            pureSnow(p);
          };
          
          p.windowResized = () => {
            p.resizeCanvas(p.windowWidth, p.windowHeight);
          };
        };
        
        new p5(sketch);
        
        const bubbleEl = document.getElementById('basementControlBubble');
        if (bubbleEl) {
          requestAnimationFrame(() => bubbleEl.classList.add('visible'));
          setTimeout(() => {
            bubbleEl.classList.remove('visible');
          }, 10000);
        }

        // Initialize tool hover effect and hint text
        const floorToolLink = document.querySelector('.floor-tool-link');
        const floorTool = document.getElementById('floorTool');
        
        if (floorToolLink && floorTool) {
          const toolHintText = document.createElement('div');
          toolHintText.className = 'floor-tool-hint-text';
          toolHintText.textContent = 'tool';
          document.body.appendChild(toolHintText);
          
          let hintAnimationFrame = null;
          const originalImageSrc = floorTool.src;
          const hoverImageSrc = originalImageSrc.replace('tool.png', 'tool2.png');
          
          // Update hint text position to follow tool
          const updateToolHintPosition = () => {
            const rect = floorToolLink.getBoundingClientRect();
            if (rect.width === 0 && rect.height === 0) {
              hintAnimationFrame = requestAnimationFrame(updateToolHintPosition);
              return;
            }
            const centerX = rect.left + rect.width / 2;
            const topY = rect.top - 20;
            toolHintText.style.left = `${centerX}px`;
            toolHintText.style.top = `${topY}px`;
            hintAnimationFrame = requestAnimationFrame(updateToolHintPosition);
          };
          
          // Show hint text, glow, and swap image on hover
          const showToolHint = (e) => {
            if (e) {
              e.stopPropagation(); // Prevent self character hover from interfering
            }
            floorToolLink.classList.add('hovered'); // Add class for glow effect
            floorTool.src = hoverImageSrc; // Swap to tool2.png
            toolHintText.style.opacity = '1';
            if (hintAnimationFrame === null) {
              updateToolHintPosition();
            }
          };
          
          // Hide hint text, remove glow, and restore original image
          const hideToolHint = (e) => {
            if (e) {
              e.stopPropagation(); // Prevent self character hover from interfering
            }
            floorToolLink.classList.remove('hovered'); // Remove class to remove glow
            floorTool.src = originalImageSrc; // Swap back to tool.png
            toolHintText.style.opacity = '0';
            if (hintAnimationFrame !== null) {
              cancelAnimationFrame(hintAnimationFrame);
              hintAnimationFrame = null;
            }
          };
          
          // Desktop: hover events - stop propagation to prevent self character interference
          floorToolLink.addEventListener('mouseenter', (e) => {
            e.stopPropagation();
            showToolHint(e);
          });
          
          floorToolLink.addEventListener('mouseleave', (e) => {
            e.stopPropagation();
            hideToolHint(e);
          });
          
          // Also add to the image itself
          floorTool.addEventListener('mouseenter', (e) => {
            e.stopPropagation();
            showToolHint(e);
          });
          
          floorTool.addEventListener('mouseleave', (e) => {
            e.stopPropagation();
            hideToolHint(e);
          });
          
          // Mobile: touch events
          floorToolLink.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            showToolHint(e);
          }, true);
          floorToolLink.addEventListener('touchend', (e) => {
            e.stopPropagation();
            setTimeout(() => {
              hideToolHint(e);
            }, 500);
          }, true);
        }

        const wallSection = document.querySelector('.wall-section');
        const floorSection = document.querySelector('.floor-section');
        const syncStairHeight = () => {
          if (!wallSection || !floorSection) return;
          const wallHeight = wallSection.offsetHeight;
          const floorHeight = floorSection.offsetHeight;
          document.documentElement.style.setProperty('--wall-height', `${wallHeight}px`);
          document.documentElement.style.setProperty('--floor-height', `${floorHeight}px`);
        };
        window.addEventListener('resize', () => {
          syncStairHeight();
        }, { passive: true });
        syncStairHeight();
        
        window.__pebbleResizeRAF = null;
        const schedulePebbleRebuild = () => {
          if (window.__pebbleResizeRAF) {
            cancelAnimationFrame(window.__pebbleResizeRAF);
          }
          window.__pebbleResizeRAF = requestAnimationFrame(async () => {
            window.__pebbleResizeRAF = null;
            await rebuildPebbleFloor();
          });
        };

        window.addEventListener('resize', () => {
          schedulePebbleRebuild();
        }, { passive: true });

        // Wait for initial render, then smoothly transition
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            // Remove loading class to fade in content
            document.body.classList.remove('loading');
            
            // Wait for content to start fading in, then hide loading screen
            setTimeout(() => {
              loadingScreen.classList.add('hidden');
            }, 100);
          });
        });
      });
    </script>
    
  </body>
</html>
