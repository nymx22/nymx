<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glitch Engine</title>
    <link rel="icon" type="image/png" href="../assets/icons/fav_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.typekit.net/pew7esm.css">
    <link rel="stylesheet" href="../style/tool/layout.css" />
    <link rel="stylesheet" href="../style/tool/gui.css" />
    <link rel="stylesheet" href="../style/desktop/cursor.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.7/build/dat.gui.min.js"></script>
  </head>
  <body>
    <audio id="background-music" loop preload="metadata">
      <source src="../assets/audio/Solo from More Travels.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
    <div class="custom-cursor"></div>
    
    <div class="tool-container">
      <div class="humanoid-source">
        <img src="../assets/gif/humanoid.gif" alt="Humanoid" id="humanoid-gif" style="display: none;" loading="lazy">
      </div>
      
      <div id="corruption-canvas-container"></div>
      
      <div id="fps-display">FPS: --</div>
      
      <div id="upload-container">
        <label for="image-upload" class="upload-label">
          <input type="file" id="image-upload" accept="image/*,video/*,.mov,.mp4,.webm,.avi" style="display: none;">
          <span class="upload-button">Upload Image/Video</span>
        </label>
        <button id="save-button" class="upload-button" style="margin-left: 10px; display: none;">Save</button>
      </div>
      
      <div id="back-button-container">
        <a href="../pages/tools.html" class="back-button">Back to Tools</a>
      </div>
    </div>
    
    <script type="module">
      import { initBackgroundMusic } from '../js/lib/music.js';
      import { initCustomCursor } from '../js/lib/desktop/cursor.js';
      
      // Initialize background music
      initBackgroundMusic();
      
      // Initialize custom cursor
      initCustomCursor();
      
      // Load signal corruption
      import('../js/lib/tool/signalCorruption.js');
    </script>
  </body>
</html>
